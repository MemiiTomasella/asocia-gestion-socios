{% extends "base.html" %}
{% block title %}Ingresar | Asocia{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; border-radius: 18px; background: var(--primary-color);">
        <svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M12 54 L32 10 L52 54" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M21 39 L29 46 L44 31" stroke="#3FB37F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h1 class="fw-bold h3 mb-1">Asocia</h1>
      <p class="text-secondary mb-0">Cuentas claras para tu institución</p>
    </div>

    <div class="card-ui p-4">
      <h2 class="h5 fw-bold mb-1">Ingresar al sistema</h2>
      <p class="text-muted small mb-3">{{ institucion_nombre }}</p>

      {% if form.errors %}
      <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label for="id_username" class="form-label">Usuario</label>
          <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Contraseña</label>
          <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
