{% if is_paginated %}
<nav aria-label="Paginación" class="mt-3">
  <ul class="pagination justify-content-center mb-0">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">&laquo; Anterior</a></li>
    {% else %}
    <li class="page-item disabled"><span class="page-link">&laquo; Anterior</span></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ page_obj.number }} de {{ paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente &raquo;</a></li>
    {% else %}
    <li class="page-item disabled"><span class="page-link">Siguiente &raquo;</span></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
